<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c81">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Parse daily HTML room schedule reports and find available rooms from your Rooms of Interest list.">
  <title>Room Finder</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
      --accent: #0f4c81;
      --accent-hover: #0c3b66;
      --accent-contrast: #ffffff;
      --secondary-bg: #e2e8f0;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --success: #15803d;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px; line-height: 1.5;
    }
    .app-shell {
      max-width: 480px; margin: 0 auto; min-height: 100dvh;
      padding: 12px 14px 28px; display: flex; flex-direction: column; gap: 12px;
    }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 2px; }
    .app-title { margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    button {
      font-family: inherit; cursor: pointer; touch-action: manipulation; border: none;
      border-radius: var(--radius); min-height: 48px; font-weight: 700; font-size: 0.95rem;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-header {
      background: var(--surface); color: var(--text); border: 1.5px solid var(--border);
      padding: 0 12px; font-size: 0.85rem; white-space: nowrap; box-shadow: var(--shadow);
    }
    .action-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-secondary {
      background: var(--surface); color: var(--text); border: 1.5px solid #94a3b8;
      padding: 0 12px; font-size: 0.98rem; min-height: 52px; box-shadow: var(--shadow);
    }
    .btn-primary {
      background: var(--accent); color: var(--accent-contrast); padding: 0 14px;
      font-size: 1rem; min-height: 52px; box-shadow: 0 3px 10px rgba(15, 76, 129, 0.28);
    }
    .btn-danger-outline {
      background: var(--danger-bg); color: var(--danger); border: 1.5px solid #fecaca; padding: 0 14px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px;
    }
    .input-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .input-label { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .status-hint { font-size: 0.82rem; color: var(--text-muted); margin: 6px 0 0; }
    .status-hint.ok { color: var(--success); font-weight: 600; }
    .status-hint.err { color: var(--danger); font-weight: 600; }
    .html-textarea, .rooms-textarea {
      width: 100%; min-height: 170px; padding: 12px; border: 1.5px solid var(--border);
      border-radius: 10px; background: var(--surface-alt); color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.88rem; line-height: 1.45; resize: vertical;
    }
    .collapsed-bar {
      width: 100%; background: var(--surface-alt); color: var(--text); border: 1.5px solid var(--border);
      justify-content: space-between; padding: 0 14px; font-size: 0.9rem; font-weight: 600;
    }
    .collapsed-meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    .collapsed-action { color: var(--accent); font-weight: 700; flex-shrink: 0; }
    .output-card { display: flex; flex-direction: column; gap: 10px; }
    .output-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .output-title { margin: 0; font-size: 1rem; font-weight: 800; }
    .btn-copy { background: var(--accent); color: var(--accent-contrast); padding: 0 16px; font-size: 0.92rem; flex-shrink: 0; }
    .btn-copy.copied { background: var(--success); }
    .output-pre {
      margin: 0; padding: 14px; background: var(--surface-alt); border: 1px solid var(--border);
      border-radius: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.94rem; line-height: 1.6; color: var(--text); white-space: pre-wrap; word-break: break-word; user-select: text;
    }
    .hidden { display: none !important; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.58);
      display: flex; align-items: flex-end; justify-content: center; z-index: 100;
    }
    @media (min-width: 500px) { .modal-backdrop { align-items: center; padding: 16px; } }
    .modal-sheet {
      width: 100%; max-width: 480px; max-height: 92dvh; background: var(--surface);
      border-radius: 18px 18px 0 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .modal-title { margin: 0; font-size: 1.15rem; font-weight: 800; }
    .room-count-badge { background: var(--secondary-bg); font-size: 0.82rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
    .modal-help { margin: 0; font-size: 0.88rem; color: var(--text-muted); }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions .full-span { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1 class="app-title">Room Finder</h1>
      <button type="button" id="editRoomsBtn" class="btn-header">Edit Rooms of Interest</button>
    </header>

    <section class="action-bar">
      <button type="button" id="pasteBtn" class="btn-secondary">Paste Daily HTML</button>
      <button type="button" id="calculateBtn" class="btn-primary">Calculate</button>
    </section>

    <section class="card">
      <div id="expandedInputWrap">
        <div class="input-header">
          <label for="htmlInput" class="input-label">Daily HTML / Report Text</label>
          <span id="roomsBadgeMini" class="status-hint" style="margin:0;"></span>
        </div>
        <textarea id="htmlInput" class="html-textarea" placeholder="Tap 'Paste Daily HTML' or long-press here to paste your daily schedule..." spellcheck="false" autocomplete="off"></textarea>
        <p id="inputStatus" class="status-hint">Ready for daily schedule.</p>
      </div>
      <button type="button" id="collapsedPreviewBtn" class="collapsed-bar hidden" aria-expanded="false">
        <span id="collapsedSummary" class="collapsed-meta">Schedule loaded</span>
        <span class="collapsed-action">Expand</span>
      </button>
    </section>

    <section id="outputCard" class="card output-card hidden" aria-live="polite">
      <div class="output-top">
        <h2 class="output-title">Availability Report</h2>
        <button type="button" id="copyBtn" class="btn-copy">Copy Result</button>
      </div>
      <pre id="outputReport" class="output-pre"></pre>
    </section>
  </div>

  <div id="roomsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="modal-title">Rooms of Interest</h2>
        <span id="modalRoomCount" class="room-count-badge">0 rooms</span>
      </div>
      <p class="modal-help">Enter room codes separated by commas, spaces, or new lines. Dots (e.g., <strong>C.107</strong>) are preserved.</p>
      <textarea id="roomsTextarea" class="rooms-textarea" spellcheck="false" autocomplete="off"></textarea>
      <div class="modal-actions">
        <button type="button" id="resetRoomsBtn" class="btn-danger-outline full-span">Reset to Default</button>
        <button type="button" id="cancelRoomsBtn" class="btn-secondary">Cancel</button>
        <button type="button" id="saveRoomsBtn" class="btn-primary">Save Rooms</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      var STORAGE_KEY = 'room_finder_rooms_of_interest_v1';
      var DEFAULT_ROOMS = [
        'H4', 'H2', 'H313', 'A107', 'A101', 'A109', 'A110', 'A111',
        'A206', 'A207', 'A208', 'A318', 'A319', 'A320', 'A321', 'A322', 'A323',
        'L101', 'L102', 'L103', 'L104', 'L105', 'L201', 'L202', 'L203', 'L204',
        'C.107', 'SL101', 'SL102', 'SL103', 'SL201', 'SL301', 'SL302', 'SL401',
        'PEB20', 'PEB30', 'PEB40', 'PE101', 'PE102', 'PE103', 'PE104', 'PE105',
        'PE201', 'PE202', 'PE203', 'PE204'
      ];

      var editRoomsBtn = document.getElementById('editRoomsBtn');
      var pasteBtn = document.getElementById('pasteBtn');
      var calculateBtn = document.getElementById('calculateBtn');
      var htmlInput = document.getElementById('htmlInput');
      var expandedInputWrap = document.getElementById('expandedInputWrap');
      var collapsedPreviewBtn = document.getElementById('collapsedPreviewBtn');
      var collapsedSummary = document.getElementById('collapsedSummary');
      var inputStatus = document.getElementById('inputStatus');
      var roomsBadgeMini = document.getElementById('roomsBadgeMini');
      var outputCard = document.getElementById('outputCard');
      var outputReport = document.getElementById('outputReport');
      var copyBtn = document.getElementById('copyBtn');
      var roomsModal = document.getElementById('roomsModal');
      var roomsTextarea = document.getElementById('roomsTextarea');
      var modalRoomCount = document.getElementById('modalRoomCount');
      var resetRoomsBtn = document.getElementById('resetRoomsBtn');
      var cancelRoomsBtn = document.getElementById('cancelRoomsBtn');
      var saveRoomsBtn = document.getElementById('saveRoomsBtn');

      function normalizeRoomList(rawText) {
        if (!rawText) return [];
        var tokens = String(rawText).replace(/\.\s+/g, '.').split(/[\s,;]+/);
        var seen = new Set();
        var result = [];
        for (var i = 0; i < tokens.length; i++) {
          var clean = tokens[i].trim().toUpperCase().replace(/[-\s]+/g, '');
          if (clean && !seen.has(clean)) { seen.add(clean); result.push(clean); }
        }
        return result;
      }

      function loadRooms() {
        try {
          var saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            var parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return normalizeRoomList(parsed.join(', '));
          }
        } catch (e) {}
        return DEFAULT_ROOMS.slice();
      }

      function saveRooms(list) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
      }

      var roomsOfInterest = loadRooms();
      roomsBadgeMini.textContent = roomsOfInterest.length + ' rooms tracked';

      function setStatus(msg, type) {
        inputStatus.textContent = msg;
        inputStatus.className = 'status-hint' + (type ? ' ' + type : '');
      }
      function expandInputArea() {
        expandedInputWrap.classList.remove('hidden');
        collapsedPreviewBtn.classList.add('hidden');
      }
      function collapseInputArea(summaryText) {
        expandedInputWrap.classList.add('hidden');
        collapsedSummary.textContent = summaryText;
        collapsedPreviewBtn.classList.remove('hidden');
      }
      function clearOutput() {
        outputReport.textContent = '';
        outputCard.classList.add('hidden');
        copyBtn.textContent = 'Copy Result';
        copyBtn.classList.remove('copied');
      }

      pasteBtn.addEventListener('click', async function () {
        htmlInput.value = '';
        clearOutput();
        expandInputArea();
        htmlInput.focus();
        setStatus('Cleared. Reading clipboard or ready for long-press paste...', '');
        if (navigator.clipboard && navigator.clipboard.readText) {
          try {
            var clipText = await navigator.clipboard.readText();
            if (clipText && clipText.trim()) {
              htmlInput.value = clipText;
              setStatus('Pasted ' + (clipText.length / 1024).toFixed(1) + ' KB. Tap Calculate.', 'ok');
              return;
            }
          } catch (err) {}
        }
        setStatus('Ready — long-press inside the box to paste.', '');
      });

      collapsedPreviewBtn.addEventListener('click', function () { expandInputArea(); htmlInput.focus(); });
      editRoomsBtn.addEventListener('click', function () {
        roomsTextarea.value = roomsOfInterest.join(', ');
        modalRoomCount.textContent = roomsOfInterest.length + ' rooms';
        roomsModal.classList.remove('hidden');
      });
      cancelRoomsBtn.addEventListener('click', function () { roomsModal.classList.add('hidden'); });
      roomsTextarea.addEventListener('input', function () {
        modalRoomCount.textContent = normalizeRoomList(roomsTextarea.value).length + ' rooms';
      });
      resetRoomsBtn.addEventListener('click', function () {
        roomsOfInterest = DEFAULT_ROOMS.slice();
        saveRooms(roomsOfInterest);
        roomsTextarea.value = roomsOfInterest.join(', ');
        modalRoomCount.textContent = roomsOfInterest.length + ' rooms';
        roomsBadgeMini.textContent = roomsOfInterest.length + ' rooms tracked';
      });
      saveRoomsBtn.addEventListener('click', function () {
        var norm = normalizeRoomList(roomsTextarea.value);
        if (!norm.length) return;
        roomsOfInterest = norm;
        saveRooms(roomsOfInterest);
        roomsBadgeMini.textContent = roomsOfInterest.length + ' rooms tracked';
        roomsModal.classList.add('hidden');
      });

      copyBtn.addEventListener('click', async function () {
        var text = outputReport.textContent;
        if (!text) return;
        try { await navigator.clipboard.writeText(text); } catch (e) {
          var t = document.createElement('textarea'); t.value = text;
          document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t);
        }
        copyBtn.textContent = 'Copied!'; copyBtn.classList.add('copied');
        setTimeout(function () { copyBtn.textContent = 'Copy Result'; copyBtn.classList.remove('copied'); }, 2000);
      });

      function cleanText(str) {
        return (str || '').replace(/[\u00a0\u200e\u200f\u202a-\u202e\ufeff]/g, ' ').replace(/[ \t]+/g, ' ').trim();
      }
      function parseClockMinutes(hStr, mStr) {
        var h = parseInt(hStr, 10), m = parseInt(mStr, 10);
        if (isNaN(h) || isNaN(m) || h < 0 || h > 24 || m < 0 || m > 59) return null;
        return h * 60 + m;
      }
      function formatTime(mins) {
        var h = Math.floor(mins / 60), m = mins % 60;
        return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
      }
      function formatDuration(mins) {
        var hrs = mins / 60;
        return Math.abs(hrs - Math.round(hrs)) < 0.01 ? Math.round(hrs) + ' hrs' : hrs.toFixed(1) + ' hrs';
      }
      function extractTimeRanges(text) {
        var ranges = [], str = cleanText(text);
        var re = /(\d{1,2})[:.](\d{2})\s*(?:-|–|—|to|עד)\s*(\d{1,2})[:.](\d{2})/gi, m;
        while ((m = re.exec(str)) !== null) {
          var t1 = parseClockMinutes(m[1], m[2]), t2 = parseClockMinutes(m[3], m[4]);
          if (t1 !== null && t2 !== null && t1 !== t2) ranges.push({ start: Math.min(t1, t2), end: Math.max(t1, t2) });
        }
        return ranges;
      }
      function extractAllClocks(text) {
        var times = [], str = cleanText(text);
        var re = /(?:^|[^\d])(\d{1,2})[:.](\d{2})(?=$|[^\d])/g, m;
        while ((m = re.exec(str)) !== null) {
          var mins = parseClockMinutes(m[1], m[2]);
          if (mins !== null && mins >= 420 && mins <= 1440) times.push(mins);
        }
        return times;
      }
      function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
      function buildRoomMatchers(rooms) {
        return rooms.map(function (room) {
          var alt = room.indexOf('.') !== -1 ? '(?:' + escapeRegex(room) + '|' + escapeRegex(room.replace('.', '')) + ')' : escapeRegex(room);
          return { code: room, regex: new RegExp('(?:^|[^A-Z0-9.])' + alt + '(?=$|[^A-Z0-9.])') };
        });
      }
      function normalizeRoomSearchText(text) {
        return cleanText(text)
          .toUpperCase()
          .replace(/\.\s+/g, '.')
          .replace(/-/g, '')
          .replace(/[\u0590-\u05FF]+\s*(?=[A-Z]+\d)/g, ' ');
      }
      function matchRoomsInText(text, matchers) {
        var norm = normalizeRoomSearchText(text);
        if (!norm) return [];
        var found = [];
        for (var i = 0; i < matchers.length; i++) {
          if (matchers[i].regex.test(norm)) found.push(matchers[i].code);
        }
        return found;
      }
      function mergeIntervals(intervals) {
        if (!intervals.length) return [];
        var sorted = intervals.slice().sort(function (a, b) { return a.start - b.start || a.end - b.end; });
        var merged = [{ start: sorted[0].start, end: sorted[0].end }];
        for (var i = 1; i < sorted.length; i++) {
          var prev = merged[merged.length - 1], cur = sorted[i];
          if (cur.start <= prev.end) { if (cur.end > prev.end) prev.end = cur.end; }
          else merged.push({ start: cur.start, end: cur.end });
        }
        return merged;
      }

      /* Converts HTML into newline-delimited text reliably across browsers and DOMParser */
      function htmlToLines(htmlString) {
        var withBreaks = htmlString
          .replace(/<style[\s\S]*?<\/style>/gi, '')
          .replace(/<script[\s\S]*?<\/script>/gi, '')
          .replace(/<(?:br|hr|\/tr|\/td|\/th|\/div|\/p|\/li|\/section|\/article|\/h[1-6])\b[^>]*>/gi, '\n');
        var doc = new DOMParser().parseFromString(withBreaks, 'text/html');
        var raw = (doc.body && doc.body.textContent) ? doc.body.textContent : withBreaks.replace(/<[^>]+>/g, '\n');
        return raw.split(/\r?\n/).map(cleanText).filter(Boolean);
      }

      function extractReportDate(rawInput) {
        var headerMatch = rawInput.match(/דוח חדרים יומי[\s\S]{0,120}?(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4})/);
        if (headerMatch) return headerMatch[1];
        var anyMatch = rawInput.match(/(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4})/);
        return anyMatch ? anyMatch[1] : new Date().toLocaleDateString('en-GB');
      }

      function parseScheduleInput(rawInput, roomsList) {
        var hasHtmlTags = /<[a-z][^>]*>/i.test(rawInput);
        var textLines = hasHtmlTags
          ? htmlToLines(rawInput)
          : rawInput.split(/\r?\n/).map(cleanText).filter(Boolean);

        var matchers = buildRoomMatchers(roomsList);
        var bookingsByRoom = {};
        var seenRooms = {};

        function addBooking(room, ranges) {
          seenRooms[room] = true;
          if (!bookingsByRoom[room]) bookingsByRoom[room] = [];
          for (var i = 0; i < ranges.length; i++) bookingsByRoom[room].push(ranges[i]);
        }

        var activeRooms = [];

        for (var l = 0; l < textLines.length; l++) {
          var line = textLines[l];
          var lineRanges = extractTimeRanges(line);
          var lineRooms = matchRoomsInText(line, matchers);

          if (lineRooms.length > 0 && lineRanges.length > 0) {
            activeRooms = lineRooms;
            for (var j = 0; j < lineRooms.length; j++) addBooking(lineRooms[j], lineRanges);
          } else if (lineRooms.length > 0 && line.length <= 75 && !/^(?:שיעור|סמינריון|סדנא|בחינה|תרגיל|מספר קורס)/.test(line)) {
            activeRooms = lineRooms;
            for (var k = 0; k < lineRooms.length; k++) addBooking(lineRooms[k], []);
          } else if (lineRanges.length > 0 && activeRooms.length > 0) {
            for (var a = 0; a < activeRooms.length; a++) addBooking(activeRooms[a], lineRanges);
          }
        }

        var reportDate = extractReportDate(rawInput);
        var dayStart = 8 * 60;               /* 08:00 morning opening */
        var morningCutoff = 13 * 60 + 30;    /* 13:30: no lecture before 13:30 */
        var afternoonCutoff = 11 * 60 + 30;  /* 11:30: no lecture from 11:30 onward */
        var eodMinutes = 21 * 60;             /* 21:00 end-of-day */
        var minBreakMins = 120;               /* > 2 hours (strictly greater than 120 mins) */

        var noLectureRooms = [];
        var breakItems = [];
        var otherRooms = [];

        for (var idx = 0; idx < roomsList.length; idx++) {
          var room = roomsList[idx];
          var merged = mergeIntervals(bookingsByRoom[room] || []);
          if (!seenRooms[room] || !merged.length) {
            noLectureRooms.push(room + ' - no lectures today');
            continue;
          }

          var firstStart = merged[0].start;
          var lastEnd = merged[merged.length - 1].end;
          var isMorningFree = firstStart >= morningCutoff;
          var isAfternoonFree = !merged.some(function (s) { return s.end > afternoonCutoff || s.start >= afternoonCutoff; });
          var roomHadQualifyingWindow = false;

          var openDur = firstStart - dayStart;
          if (firstStart > dayStart && openDur > minBreakMins) {
            roomHadQualifyingWindow = true;
            breakItems.push({
              room: room,
              duration: openDur,
              text: room + ' available from ' + formatTime(dayStart) + ' - ' + formatTime(firstStart) + ' (' + formatDuration(openDur) + ')'
            });
          }

          var otherCandidates = [];
          if (isAfternoonFree) {
            var aftStart = Math.max(afternoonCutoff, lastEnd);
            var aftDur = eodMinutes - aftStart;
            if (aftDur > minBreakMins) {
              otherCandidates.push({
                room: room,
                duration: aftDur,
                text: formatDuration(aftDur) + ' — ' + room + ' (Afternoon free: no lecture from 11:30, free ' + formatTime(aftStart) + '-end-of-day)'
              });
            }
          }
          if (isMorningFree) {
            var mornDur = firstStart - afternoonCutoff;
            if (mornDur > minBreakMins) {
              otherCandidates.push({
                room: room,
                duration: mornDur,
                text: formatDuration(mornDur) + ' — ' + room + ' (Morning free: no lecture before 13:30, first at ' + formatTime(firstStart) + ')'
              });
            }
          }
          for (var g = 1; g < merged.length; g++) {
            var gDur = merged[g].start - merged[g - 1].end;
            if (gDur > minBreakMins) {
              otherCandidates.push({
                room: room,
                duration: gDur,
                text: formatDuration(gDur) + ' — ' + room + ' (' + formatTime(merged[g - 1].end) + '-' + formatTime(merged[g].start) + ')'
              });
            }
          }
          if (!isAfternoonFree && (eodMinutes - lastEnd) > minBreakMins) {
            var endDur = eodMinutes - lastEnd;
            otherCandidates.push({
              room: room,
              duration: endDur,
              text: formatDuration(endDur) + ' — ' + room + ' (' + formatTime(lastEnd) + '-end-of-day)'
            });
          }

          if (otherCandidates.length) {
            roomHadQualifyingWindow = true;
            otherCandidates.sort(function (a, b) { return b.duration - a.duration; });
            breakItems.push(otherCandidates[0]);
          }

          if (!roomHadQualifyingWindow) {
            otherRooms.push(room);
          }
        }

        breakItems.sort(function (a, b) { return b.duration - a.duration || a.room.localeCompare(b.room); });

        var out = [
          'Date: ' + reportDate, '',
          'NO LECTURES TODAY / NOT LISTED (' + noLectureRooms.length + '):'
        ];
        if (noLectureRooms.length) noLectureRooms.forEach(function (n) { out.push(n); });
        else out.push('None');
        out.push('', 'BREAKS > 2 HRS — LONGEST FIRST (' + breakItems.length + '):');
        if (breakItems.length) breakItems.forEach(function (b) { out.push(b.text); });
        else out.push('None');
        out.push('', 'OTHER ROOMS (<= 2 HR BREAKS / BOOKED) (' + otherRooms.length + '):', otherRooms.length ? otherRooms.join(', ') : 'None');

        return { report: out.join('\n'), foundCount: Object.keys(seenRooms).length };
      }

      calculateBtn.addEventListener('click', function () {
        var rawHtml = htmlInput.value;
        if (!rawHtml || !rawHtml.trim()) {
          setStatus('Please paste the daily HTML schedule first.', 'err');
          return;
        }
        var res = parseScheduleInput(rawHtml, roomsOfInterest);
        outputReport.textContent = res.report;
        outputCard.classList.remove('hidden');
        collapseInputArea('Parsed (' + (rawHtml.length / 1024).toFixed(1) + ' KB · ' + res.foundCount + ' rooms matched)');
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
      }
    })();
  </script>
</body>
</html>
